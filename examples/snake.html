<!DOCTYPE html>
<title>Snake</title>
<body style="margin:0;background:#123;color:#fff;text-align:center;
  font:5vmin sans-serif;touch-action:none">
<div id=score>Arrow keys or swipe</div>
<canvas id=board width=400 height=400 style="width:85vmin;background:#000"></canvas>
<script>
const pen = board.getContext('2d');
pen.font = '16px serif';
const rand = () => Math.floor(Math.random() * 20);
let snake = [{x: 10, y: 10}];        // the first one is the head
let food = {x: 5, y: 5};
let dx = 1, dy = 0;                  // direction: moving right

function step() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  const hitWall = head.x < 0 || head.x > 19 || head.y < 0 || head.y > 19;
  const hitSelf = snake.some(s => s.x == head.x && s.y == head.y);
  if (hitWall || hitSelf) {          // crashed: start over
    score.textContent = 'Crashed! Score ' + (snake.length - 1);
    snake = [{x: 10, y: 10}]; dx = 1; dy = 0;
    return;
  }
  snake.unshift(head);               // add a new head
  if (head.x == food.x && head.y == food.y) {
    food = {x: rand(), y: rand()};   // ate it: keep the tail, so we grow
    score.textContent = 'Score ' + (snake.length - 1);
  } else snake.pop();                // didn't eat: remove the tail
}
function draw() {
  pen.clearRect(0, 0, 400, 400);
  pen.fillText('🍎', food.x * 20, food.y * 20 + 16);
  snake.forEach((s, i) => {
    pen.fillText(i == 0 ? '🐍' : '🟢', s.x * 20, s.y * 20 + 16);
  });
}
onkeydown = e => {
  if (e.key == 'ArrowUp')    { dx = 0;  dy = -1; }
  if (e.key == 'ArrowDown')  { dx = 0;  dy = 1; }
  if (e.key == 'ArrowLeft')  { dx = -1; dy = 0; }
  if (e.key == 'ArrowRight') { dx = 1;  dy = 0; }
};
let sx, sy;                          // swiping on a phone
onpointerdown = e => { sx = e.clientX; sy = e.clientY; };
onpointerup = e => {
  const mx = e.clientX - sx, my = e.clientY - sy;
  if (Math.abs(mx) > Math.abs(my)) { dx = Math.sign(mx); dy = 0; }
  else { dx = 0; dy = Math.sign(my); }
};
setInterval(() => { step(); draw(); }, 120);
</script>
