<!DOCTYPE html>
<title>Cat vs Dog</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center;
         background: #234; color: white; font: bold 5vmin sans-serif; text-align: center; }
  #board { position: relative; display: grid;
           grid-template-columns: repeat(3, 22vmin); gap: 1.5vmin; }
  #board svg { position: absolute; inset: 0; width: 100%; height: 100%;
               pointer-events: none; overflow: visible; }
  .square { height: 22vmin; font-size: 14vmin; border: 0; border-radius: 2vmin;
            background: #fff3; }
  #newGame { font-size: 4vmin; padding: 1vmin 3vmin; color: white;
             background: #fff3; border: 0; border-radius: 2vmin; }
</style>

<div id="message"></div>
<div id="board"></div>
<button id="newGame" onclick="newGame()">New game</button>

<script>
// Want different players? Change these two emoji!
const PLAYER_1 = '🐱';
const PLAYER_2 = '🐶';

// The squares are numbered 0 to 8, left to right, top to bottom.
// These are all 8 ways to win: 3 rows, 3 columns and 2 diagonals.
const WINNING_LINES = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8],
  [0, 3, 6], [1, 4, 7], [2, 5, 8],
  [0, 4, 8], [2, 4, 6],
];

let squares;         // what is in each square: '' (empty) or a player's emoji
let currentPlayer;   // whose turn it is
let gameOver;

function newGame() {
  squares = ['', '', '', '', '', '', '', '', ''];
  currentPlayer = PLAYER_1;
  gameOver = false;
  draw(currentPlayer + "'s turn");
}

function play(i) {
  if (squares[i] !== '' || gameOver) return;   // ignore taken squares
  squares[i] = currentPlayer;

  const winningLine = findWinningLine();
  if (winningLine) {
    gameOver = true;
    draw(currentPlayer + ' wins! 🎉', winningLine);
  } else if (!squares.includes('')) {          // no empty squares left
    gameOver = true;
    draw("It's a tie!");
  } else {
    currentPlayer = (currentPlayer === PLAYER_1) ? PLAYER_2 : PLAYER_1;
    draw(currentPlayer + "'s turn");
  }
}

// Find a line where all 3 squares belong to the current player
function findWinningLine() {
  return WINNING_LINES.find(line =>
    line.every(i => squares[i] === currentPlayer));
}

function draw(text, winningLine) {
  message.textContent = text;
  board.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    board.innerHTML += `<button class="square" onclick="play(${i})">${squares[i]}</button>`;
  }
  if (winningLine) drawWinningLine(winningLine);
}

function drawWinningLine(line) {
  // Each square is 1 unit wide, so square number i has its middle at:
  const first = {x: line[0] % 3 + 0.5, y: Math.floor(line[0] / 3) + 0.5};
  const last  = {x: line[2] % 3 + 0.5, y: Math.floor(line[2] / 3) + 0.5};
  // Stretch the line a little past both ends
  const moreX = Math.sign(last.x - first.x) * 0.65;
  const moreY = Math.sign(last.y - first.y) * 0.65;
  board.innerHTML += `
    <svg viewBox="0 0 3 3">
      <line x1="${first.x - moreX}" y1="${first.y - moreY}"
            x2="${last.x + moreX}" y2="${last.y + moreY}"
            stroke="gold" stroke-width="0.09" stroke-linecap="round" />
    </svg>`;
}

newGame();
</script>
