<!DOCTYPE html>
<meta charset="utf-8">
<title>Favicon options</title>
<style>
  body { margin:0; padding:24px; background:#f1f3f8; font:16px system-ui,sans-serif; color:#222 }
  h1 { margin:0 0 16px }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px }
  .card { background:#fff; border-radius:12px; padding:16px; text-align:center }
  .card b { display:block; margin-bottom:10px }
  .sizes { display:flex; align-items:end; justify-content:center; gap:14px }
  .tab { display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:6px 10px; background:#dde1ea; border-radius:8px 8px 0 0; font-size:13px }
  .tab img { width:16px; height:16px }
</style>
<h1>Favicon options</h1>
<div class="grid" id="g"></div>
<script>
const opts = [['1-play','1. Play button'],['2-controller','2. Game controller'],['3-code-play','3. Code + play'],['4-invader','4. Pixel invader'],['5-cat-dog','5. Cat &amp; dog'],['6-rocket-circle','6. Gradient play']];
g.innerHTML = opts.map(([f,n]) => `<div class="card"><b>${n}</b><div class="sizes"><img src="${f}.svg" width="96"><img src="${f}.svg" width="48"><img src="${f}.svg" width="32"><img src="${f}.svg" width="16"></div><div class="tab"><img src="${f}.svg">Paste &amp; Play</div></div>`).join('');
</script>
