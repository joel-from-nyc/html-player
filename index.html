<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste &amp; Play</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: system-ui, sans-serif; background: #14161f; color: #e8e8f0;
  }
  header { padding: 16px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
  h1 img { display: block; }
  main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 24px; }
  textarea {
    flex: 1; min-height: 50vh; width: 100%; resize: vertical;
    background: #0d0f16; color: #d6e2ff; border: 2px solid #2b3047; border-radius: 8px;
    padding: 12px; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; tab-size: 2;
  }
  textarea:focus { outline: none; border-color: #5b8cff; }
  body.dragging textarea { border-color: #2e9e5b; background: #10201a; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #bar { display: flex; flex-wrap: nowrap; gap: 8px; align-items: stretch; }
  #bar button { white-space: nowrap; padding: 12px clamp(10px, 3vw, 22px); font-size: clamp(.8rem, 3.8vw, 1rem); }
  #bar button.primary { font-size: clamp(.9rem, 4.2vw, 1.1rem); }
  #bar #paste { background: #2f6fe0; padding-inline: 14px; display: inline-flex; align-items: center; }
  #bar #upload { background: #e8861a; padding-inline: 14px; display: inline-flex; align-items: center; }
  #bar #clear { background: #8a2c36; }
  #bar #sample { margin-left: auto; }
  #sample .short { display: none; }
  @media (max-width: 380px) { #bar { gap: 4px; } #bar button { padding-inline: 7px !important; } #bar #paste, #bar #upload { padding-inline: 8px !important; } #bar svg { width: 20px; height: 20px; } }
  @media (max-width: 300px) { #bar button { padding-inline: 5px !important; font-size: .75rem !important; } #bar #paste, #bar #upload { padding-inline: 6px !important; } }
  @media (max-width: 420px) { #sample .long { display: none; } #sample .short { display: inline; } }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 8px;
    cursor: pointer; color: #fff; background: #2b3047;
  }
  button.primary { background: #2e9e5b; font-size: 1.1rem; }
  button:hover { filter: brightness(1.15); }
  #msg { color: #8fd; min-height: 1.2em; }
  #msg.err { color: #f88; }
  small { color: #789; }
  #ver { font-size: .72rem; color: #678; flex: none; cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: background .25s, color .25s; user-select: none; }
  #ver.flash { background: #2e9e5b; color: #fff; }
  #ver.flash.white { background: #fff; color: #14161f; }
  footer { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding: 0 24px 14px; color: #678; font-size: .8rem; }
  @media (max-width: 420px) {
    header, main, footer { padding-inline: 12px; }
    #bar { gap: 6px; }
    #bar button { padding-inline: 9px; }
  }
  dialog { background: #1b1f2e; color: #e8e8f0; border: 2px solid #5b8cff; border-radius: 12px; padding: 20px 24px; max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog p { margin: 0 0 16px; }
  dialog .row { justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <div>
    <h1><img src="favicon.svg" alt="" width="34" height="34"> Paste &amp; Play</h1>
  </div>
  <span id="ver" title="Tap to check for updates">v0.1.21</span>
</header>

<main id="editor">
  <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
    placeholder="Paste your HTML or drop a file here."></textarea>
  <span id="msg"></span>
  <div id="bar">
    <button id="paste" aria-label="Paste from clipboard" title="Paste from clipboard">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/></svg>
    </button>
    <button id="upload" aria-label="Upload a file" title="Upload a file">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    </button>
    <input type="file" id="file" hidden>
    <button class="primary" id="play">▶ Play</button>
    <button id="clear">Clear</button>
    <button id="sample"><span class="long">Show sample</span><span class="short">Sample</span></button>
  </div>
</main>

<footer>
  <span>Nothing opened? Allow pop-ups for this site (icon at the right end of the address bar).</span>
</footer>

<dialog id="ask">
  <p id="askText"></p>
  <div class="row">
    <button id="askReplace" class="primary">Replace</button>
    <button id="askAdd">Add to end</button>
    <button id="askCancel">Cancel</button>
  </div>
</dialog>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };

  // ---- run a game as its own top-level page (so fullscreen works) ----
  // Content-Security-Policy added to every game: no outside network, scripts,
  // frames or form posts. Inline code, canvas, audio, inputs and localStorage still work.
  // No content restrictions: games can load libraries, fonts, images and make network requests.
  function blobUrl(html) {
    return URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  }

  $('play').onclick = () => {
    const html = $('code').value;
    if (!html.trim()) return msg('Paste some code first!', true);
    const w = window.open(blobUrl(html), '_blank');
    if (!w) return msg('Your browser blocked the new tab. Click the pop-up icon at the right end of the address bar and choose "Always allow", then press Play again.', true);
    try { w.opener = null; } catch (e) {}   // game tab can't reach back to this page
    msg('');
  };

  $('sample').onclick = async () => {
    if ($('code').value.trim() && !confirm('Replace what is in the box with the sample game?')) return;
    try {
      const r = await fetch('examples/tictactoe.html');
      if (!r.ok) throw 0;
      $('code').value = await r.text();
      msg('Sample loaded. Press Play!');
    } catch (e) { msg("Couldn't load the sample game.", true); }
  };

  // Tap the version: if a newer version is live, reload; if not, flash white/green.
  $('ver').onclick = async () => {
    const ver = $('ver');
    try {
      const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
      const live = (await r.text()).match(/id="ver"[^>]*>([^<]+)</);
      if (live && live[1].trim() !== ver.textContent.trim()) return location.reload();
    } catch (e) { return location.reload(); }   // couldn't check, so just refresh
    ver.classList.add('flash');
    [0, 250, 500, 750].forEach((t, i) => setTimeout(() => ver.classList.toggle('white', i % 2 === 0), t));
    setTimeout(() => ver.classList.remove('flash', 'white'), 1000);
  };

  $('clear').onclick = () => { $('code').value = ''; msg(''); };

  // Put text in the box. If the box already has code, ask: replace, add to end, or cancel.
  async function putText(text, label) {
    const box = $('code');
    if (box.value.trim()) {
      $('askText').textContent = 'The box already has code. What should I do with ' + label + '?';
      const choice = await new Promise(res => {
        const d = $('ask');
        const done = v => () => { d.close(); res(v); };
        $('askReplace').onclick = done('replace');
        $('askAdd').onclick = done('add');
        $('askCancel').onclick = done('cancel');
        d.oncancel = () => res('cancel');
        d.showModal();
      });
      if (choice === 'cancel') return msg('');
      if (choice === 'add') { box.value = box.value.replace(/\s*$/, '') + '\n' + text; return msg('Added ' + label + ' to the end'); }
    }
    box.value = text;
    msg('Loaded ' + label);
  }

  // Paste button: read the clipboard (the browser may ask permission the first time).
  $('paste').onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (!text.trim()) return msg('The clipboard is empty.', true);
      putText(text, 'the pasted text');
    } catch (e) {
      msg('Could not read the clipboard. Tap and hold in the box, then choose Paste.', true);
    }
  };

  // Read a text/HTML file into the box (shared by drag & drop and the upload button).
  async function loadFile(f) {
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) return msg('That file is too big (5 MB max).', true);
    const text = await f.text();
    if (text.indexOf('\u0000') !== -1 || text.indexOf('\uFFFD') !== -1)
      return msg("That doesn't look like a text file.", true);
    putText(text, f.name);
  }

  // drag & drop a text/HTML file to fill the box
  const dropOk = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => {
    if (!dropOk(e)) return;
    e.preventDefault(); document.body.classList.add('dragging');
  }));
  window.addEventListener('dragleave', e => {
    if (!e.relatedTarget) document.body.classList.remove('dragging');
  });
  window.addEventListener('drop', async e => {
    if (!dropOk(e)) return;
    e.preventDefault(); document.body.classList.remove('dragging');
    loadFile(e.dataTransfer.files[0]);
  });

  // Upload button: pick a file from the device
  $('upload').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };

  // allow Tab key in textarea
  $('code').addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  });

})();
</script>
</body>
</html>
