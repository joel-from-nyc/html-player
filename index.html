<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste &amp; Play</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: system-ui, sans-serif; background: #14161f; color: #e8e8f0;
  }
  header { padding: 16px 24px 0; }
  h1 { margin: 0; font-size: 1.5rem; }
  p.sub { margin: 4px 0 0; color: #9aa; font-size: .95rem; }
  main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 24px; }
  textarea {
    flex: 1; min-height: 50vh; width: 100%; resize: vertical;
    background: #0d0f16; color: #d6e2ff; border: 2px solid #2b3047; border-radius: 8px;
    padding: 12px; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; tab-size: 2;
  }
  textarea:focus { outline: none; border-color: #5b8cff; }
  body.dragging textarea { border-color: #2e9e5b; background: #10201a; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 8px;
    cursor: pointer; color: #fff; background: #2b3047;
  }
  button.primary { background: #2e9e5b; font-size: 1.1rem; }
  button:hover { filter: brightness(1.15); }
  #msg { color: #8fd; min-height: 1.2em; }
  #msg.err { color: #f88; }
  small { color: #789; }
  #ver { cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: background .25s, color .25s; user-select: none; }
  #ver.flash { background: #2e9e5b; color: #fff; }
  #ver.flash.white { background: #fff; color: #14161f; }
  footer { display: flex; justify-content: space-between; gap: 16px; padding: 0 24px 14px; color: #678; font-size: .8rem; }
  dialog { background: #1b1f2e; color: #e8e8f0; border: 2px solid #5b8cff; border-radius: 12px; padding: 20px 24px; max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog p { margin: 0 0 16px; }
  dialog .row { justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1>🎮 Paste &amp; Play</h1>
  <p class="sub">Paste your HTML</p>
</header>

<main id="editor">
  <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
    placeholder="Paste your HTML"></textarea>
  <div class="row">
    <button class="primary" id="play">▶ Play</button>
    <button id="clear">Clear</button>
    <span id="msg"></span>
    <button id="sample" style="margin-left:auto">Show sample game</button>
  </div>
</main>

<footer>
  <span>Nothing opened? Allow pop-ups for this site (icon at the right end of the address bar).</span>
  <span id="ver" title="Tap to check for updates">v0.1.9</span>
</footer>

<dialog id="ask">
  <p id="askText"></p>
  <div class="row">
    <button id="askReplace" class="primary">Replace</button>
    <button id="askAdd">Add to end</button>
    <button id="askCancel">Cancel</button>
  </div>
</dialog>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };

  // ---- run a game as its own top-level page (so fullscreen works) ----
  // Content-Security-Policy added to every game: no outside network, scripts,
  // frames or form posts. Inline code, canvas, audio, inputs and localStorage still work.
  const CSP = "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; " +
    "style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; " +
    "worker-src blob:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'";
  const META = '<meta http-equiv="Content-Security-Policy" content="' + CSP + '">';

  function withPolicy(html) {
    // insert right after any leading comments/doctype so the doctype (and layout mode) is kept
    const m = html.match(/^\s*(?:<!--[\s\S]*?-->\s*)*(?:<!doctype[^>]*>)?/i);
    const i = m ? m[0].length : 0;
    return html.slice(0, i) + META + html.slice(i);
  }

  function blobUrl(html) {
    return URL.createObjectURL(new Blob([withPolicy(html)], { type: 'text/html;charset=utf-8' }));
  }

  $('play').onclick = () => {
    const html = $('code').value;
    if (!html.trim()) return msg('Paste some code first!', true);
    const w = window.open(blobUrl(html), '_blank');
    if (!w) return msg('Your browser blocked the new tab. Click the pop-up icon at the right end of the address bar and choose "Always allow", then press Play again.', true);
    try { w.opener = null; } catch (e) {}   // game tab can't reach back to this page
    msg('');
  };

  $('sample').onclick = async () => {
    if ($('code').value.trim() && !confirm('Replace what is in the box with the sample game?')) return;
    try {
      const r = await fetch('examples/tictactoe.html');
      if (!r.ok) throw 0;
      $('code').value = await r.text();
      msg('Sample loaded. Press Play!');
    } catch (e) { msg("Couldn't load the sample game.", true); }
  };

  // Tap the version: if a newer version is live, reload; if not, flash white/green.
  $('ver').onclick = async () => {
    const ver = $('ver');
    try {
      const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
      const live = (await r.text()).match(/id="ver"[^>]*>([^<]+)</);
      if (live && live[1].trim() !== ver.textContent.trim()) return location.reload();
    } catch (e) { return location.reload(); }   // couldn't check, so just refresh
    ver.classList.add('flash');
    [0, 250, 500, 750].forEach((t, i) => setTimeout(() => ver.classList.toggle('white', i % 2 === 0), t));
    setTimeout(() => ver.classList.remove('flash', 'white'), 1000);
  };

  $('clear').onclick = () => { $('code').value = ''; msg(''); };

  // drag & drop a text/HTML file to fill the box
  const dropOk = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => {
    if (!dropOk(e)) return;
    e.preventDefault(); document.body.classList.add('dragging');
  }));
  window.addEventListener('dragleave', e => {
    if (!e.relatedTarget) document.body.classList.remove('dragging');
  });
  window.addEventListener('drop', async e => {
    if (!dropOk(e)) return;
    e.preventDefault(); document.body.classList.remove('dragging');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) return msg('That file is too big (5 MB max).', true);
    const text = await f.text();
    if (text.indexOf('\u0000') !== -1 || text.indexOf('\uFFFD') !== -1)
      return msg("That doesn't look like a text file.", true);
    const box = $('code');
    if (box.value.trim()) {
      $('askText').textContent = 'The box already has code. What should I do with ' + f.name + '?';
      const choice = await new Promise(res => {
        const d = $('ask');
        const done = v => () => { d.close(); res(v); };
        $('askReplace').onclick = done('replace');
        $('askAdd').onclick = done('add');
        $('askCancel').onclick = done('cancel');
        d.oncancel = () => res('cancel');
        d.showModal();
      });
      if (choice === 'cancel') return msg('');
      if (choice === 'add') { box.value = box.value.replace(/\s*$/, '') + '\n' + text; return msg('Added ' + f.name + ' to the end'); }
    }
    box.value = text;
    msg('Loaded ' + f.name);
  });

  // allow Tab key in textarea
  $('code').addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  });

})();
</script>
</body>
</html>
