<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste &amp; Play</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: system-ui, sans-serif; background: #14161f; color: #e8e8f0;
  }
  header { padding: 16px 24px 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 12px; }
  #top { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  button.icon { padding: 6px 8px; background: none; border: 1px solid #2b3047; color: #9ab; display: inline-flex; border-radius: 8px; }
  /* Word wrap: a faint ghost button floating in the lower right of the box.
     Brighter (and a quick flash) while words are actually being wrapped.
     On hover, a faded icon shows what clicking will do. */
  #boxwrap { position: relative; display: flex; flex: 1; }
  #wrap { position: absolute; right: 24px; bottom: 10px; padding: 6px 8px; display: inline-flex;
          background: rgba(13, 15, 22, .7); border: 1px solid #2b3047; border-radius: 8px;
          color: #9ab; opacity: .35; transition: opacity .3s; }
  #wrap.active { opacity: .75; color: #d6e2ff; border-color: #3d5a8a; }
  #wrap.flash { animation: wrapflash .8s ease-out; }
  @keyframes wrapflash {
    0%   { opacity: 1; box-shadow: 0 0 0 5px rgba(91, 140, 255, .55); }
    100% { box-shadow: 0 0 0 0 rgba(91, 140, 255, 0); }
  }
  #wrap svg { display: none; }
  #wrap[aria-pressed="true"] .i-wrap, #wrap[aria-pressed="false"] .i-nowrap { display: block; }
  @media (hover: hover) {
    #wrap:hover { opacity: .85; }
    #wrap[aria-pressed]:hover svg { display: none; }
    #wrap[aria-pressed="true"]:hover .i-nowrap, #wrap[aria-pressed="false"]:hover .i-wrap { display: block; opacity: .55; }
  }
  /* smaller header buttons on phones so the title and all four still share one line */
  @media (max-width: 420px) {
    #top { gap: 2px; }
    button.icon { padding: 5px 6px; }
    button.icon svg { width: 16px; height: 16px; }
  }
  @media (max-width: 380px) {
    header { gap: 6px; }
    h1 { font-size: clamp(1rem, 4.8vw, 1.5rem); gap: 6px; }
    h1 img { width: 24px; }
    header #ver { padding-inline: 3px; }
  }
  @media (max-width: 340px) {
    button.icon { padding: 4px 5px; }
    button.icon svg { width: 15px; height: 15px; }
    header #ver { padding-inline: 3px; }
  }
  button:disabled { opacity: .3; cursor: default; }
  button:disabled:hover { filter: none; }
  h1 { margin: 0; font-size: clamp(1.05rem, 5.4vw, 1.5rem); display: flex; align-items: center; gap: 8px; }
  h1 img { display: block; width: clamp(26px, 8vw, 34px); height: auto; }
  main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 24px; }
  textarea {
    flex: 1; min-height: 50vh; width: 100%; resize: vertical; /* sits inside #boxwrap */
    background: #0d0f16; color: #d6e2ff; border: 2px solid #2b3047; border-radius: 8px;
    padding: 12px; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; tab-size: 2;
  }
  textarea:focus { outline: none; border-color: #5b8cff; }
  body.dragging textarea { border-color: #2e9e5b; background: #10201a; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  /* Bottom buttons: icon + word when there is room. When there isn't, the JS adds
     "compact" and every button except Play shows just its icon (all on or all off). */
  #bar { display: flex; flex-wrap: nowrap; gap: 8px; align-items: stretch; }
  #bar button { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; padding: 12px 16px; font-size: 1rem; }
  #bar button.primary { font-size: 1.1rem; }
  #bar svg { width: 20px; height: 20px; flex: none; }
  #bar #paste { background: #2f6fe0; }
  #bar #upload { background: #e8861a; margin-left: 16px; }   /* a little gap after Play */
  #bar #save { background: #a8913a; }
  #bar #sample { background: #b4788c; margin-left: auto; }
  #bar #clear { background: #8a2c36; }
  #bar.compact { gap: clamp(4px, 1.6vw, 8px); }
  #bar.compact .label { display: none; }
  #bar.compact button { padding: 12px clamp(6px, 2.2vw, 14px); font-size: clamp(.72rem, 3.7vw, 1rem); }
  #bar.compact button.primary { padding-inline: clamp(7px, 2.4vw, 20px); font-size: clamp(.8rem, 4.1vw, 1.1rem); }
  #bar.compact svg { width: clamp(18px, 5.6vw, 22px); height: clamp(18px, 5.6vw, 22px); }
  #bar.compact #upload { margin-left: clamp(3px, 1.8vw, 18px); }
  @media (max-width: 300px) {
    #bar.compact { gap: 3px; }
    #bar.compact button { padding-inline: 4px; }
    #bar.compact #upload { margin-left: 2px; }
  }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 8px;
    cursor: pointer; color: #fff; background: #2b3047;
  }
  button.primary { background: #2e9e5b; font-size: 1.1rem; }
  button:hover { filter: brightness(1.15); }
  #msg { color: #8fd; min-height: 1.2em; }
  #msg.err { color: #f88; }
  small { color: #789; }
  #ver { font-size: .72rem; color: #678; flex: none; cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: background .25s, color .25s; user-select: none; }
  #ver.flash { background: #2e9e5b; color: #fff; }
  #ver.flash.white { background: #fff; color: #14161f; }
  footer { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding: 0 24px 14px; color: #678; font-size: .8rem; }
  @media (max-width: 420px) {
    header, main, footer { padding-inline: 12px; }
  }
  dialog { background: #1b1f2e; color: #e8e8f0; border: 2px solid #5b8cff; border-radius: 12px; padding: 20px 24px; max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog p { margin: 0 0 16px; }
  dialog .row { justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1><img src="favicon.svg" alt="" width="34" height="34"> Paste &amp; Play</h1>
  <div id="top">
    <button id="undo" class="icon" aria-label="Undo" title="Undo" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button id="redo" class="icon" aria-label="Redo" title="Redo" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
    </button>
    <button id="copy" class="icon" aria-label="Copy" title="Copy">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button id="paste2" class="icon" aria-label="Paste" title="Paste">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/></svg>
    </button>
    <span id="ver" title="Check for updates">v0.1.28</span>
  </div>
</header>

<main id="editor">
  <div id="boxwrap">
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="Paste your HTML or drop a file here."></textarea>
    <button id="wrap" aria-label="Word wrap" aria-pressed="true" title="Turn word wrap off">
      <svg class="i-wrap" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M3 12h15a3 3 0 1 1 0 6h-4"/><path d="M16 16l-2 2 2 2"/><path d="M3 18h7"/></svg>
      <svg class="i-nowrap" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M3 12h12"/><path d="M3 18h18"/><path d="M18 15l3 3-3 3"/></svg>
    </button>
  </div>
  <span id="msg"></span>
  <div id="bar">
    <button id="paste" aria-label="Paste" title="Paste">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/></svg>
      <span class="label">Paste</span>
    </button>
    <button class="primary" id="play" title="Play">▶ Play</button>
    <button id="upload" aria-label="Upload a file" title="Upload a file">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span class="label">Upload</span>
    </button>
    <input type="file" id="file" hidden>
    <button id="save" aria-label="Save as" title="Save as">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3"/><path d="M7 21v-7h10v7"/></svg>
      <span class="label">Save as</span>
    </button>
    <button id="sample" aria-label="Sample game" title="Sample game">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4"/><path d="M16 11.5h.01M18.5 13.5h.01"/></svg>
      <span class="label">Sample</span>
    </button>
    <button id="clear" aria-label="Clear" title="Clear">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      <span class="label">Clear</span>
    </button>
  </div>
</main>

<footer>
  <span>Nothing opened? Allow pop-ups for this site (icon at the right end of the address bar).</span>
</footer>

<dialog id="ask">
  <p id="askText"></p>
  <div class="row">
    <button id="askReplace" class="primary">Replace</button>
    <button id="askAdd">Add to end</button>
    <button id="askCancel">Cancel</button>
  </div>
</dialog>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };

  // ---- run a game as its own top-level page (so fullscreen works) ----
  // No content restrictions: games can load libraries, fonts, images and make network requests.
  function blobUrl(html) {
    return URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  }

  $('play').onclick = () => {
    const html = $('code').value;
    if (!html.trim()) return msg('Paste some code first!', true);
    const w = window.open(blobUrl(html), '_blank');
    if (!w) return msg('Your browser blocked the new tab. Click the pop-up icon at the right end of the address bar and choose "Always allow", then press Play again.', true);
    try { w.opener = null; } catch (e) {}   // game tab can't reach back to this page
    msg('');
  };

  $('sample').onclick = async () => {
    if ($('code').value.trim() && !confirm('Replace what is in the box with the sample game?')) return;
    try {
      const r = await fetch('examples/tictactoe.html');
      if (!r.ok) throw 0;
      let text = await r.text();
      // Easter egg: a 1 in 100 chance each time the sample is loaded
      if (Math.random() < 0.01) {
        text = text.replace("'Cats vs Dogs'", "'Wizards vs Dragons'")
                   .replace("{emoji: '🐱', name: 'Cat'}", "{emoji: '🧙‍♂️', name: 'Wizard'}")
                   .replace("{emoji: '🐶', name: 'Dog'}", "{emoji: '🐲', name: 'Dragon'}");
      }
      setBox(text);
      msg('Sample loaded. Press Play!');
    } catch (e) { msg("Couldn't load the sample game.", true); }
  };

  // Bottom buttons: show words if they all fit on one row, otherwise icons only.
  function fitBar() {
    const bar = $('bar');
    bar.classList.remove('compact');
    if (bar.scrollWidth > bar.clientWidth + 1) bar.classList.add('compact');
  }
  fitBar();
  addEventListener('resize', fitBar);
  if (document.fonts) document.fonts.ready.then(fitBar);

  // Tap the version: if a newer version is live, reload; if not, flash white/green.
  $('ver').onclick = async () => {
    const ver = $('ver');
    try {
      const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
      const live = (await r.text()).match(/id="ver"[^>]*>([^<]+)</);
      if (live && live[1].trim() !== ver.textContent.trim()) return location.reload();
    } catch (e) { return location.reload(); }   // couldn't check, so just refresh
    ver.classList.add('flash');
    [0, 250, 500, 750].forEach((t, i) => setTimeout(() => ver.classList.toggle('white', i % 2 === 0), t));
    setTimeout(() => ver.classList.remove('flash', 'white'), 1000);
  };

  $('clear').onclick = () => { setBox(''); msg(''); };

  // Put text in the box. If the box already has code, ask: replace, add to end, or cancel.
  async function putText(text, label) {
    const box = $('code');
    if (box.value.trim()) {
      $('askText').textContent = 'The box already has code. What should I do with ' + label + '?';
      const choice = await new Promise(res => {
        const d = $('ask');
        const done = v => () => { d.close(); res(v); };
        $('askReplace').onclick = done('replace');
        $('askAdd').onclick = done('add');
        $('askCancel').onclick = done('cancel');
        d.oncancel = () => res('cancel');
        d.showModal();
      });
      if (choice === 'cancel') return msg('');
      if (choice === 'add') { setBox(box.value.replace(/\s*$/, '') + '\n' + text); return msg('Added ' + label + ' to the end'); }
    }
    setBox(text);
    msg('Loaded ' + label);
  }

  // Paste button: read the clipboard (the browser may ask permission the first time).
  async function doPaste() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text.trim()) return msg('The clipboard is empty.', true);
      putText(text, 'the pasted text');
    } catch (e) {
      // Clipboard access was refused (Ctrl+V still works, it needs no permission).
      // Put the cursor in the box so the keyboard shortcut works right away.
      codeBox.focus();
      const touch = matchMedia('(pointer: coarse)').matches;
      const key = /Mac|iPhone|iPad/.test(navigator.userAgent) ? 'Cmd+V' : 'Ctrl+V';
      msg(touch ? 'Paste is blocked. Tap and hold in the box, then choose Paste.'
                : 'Paste is blocked here. Press ' + key + ' in the box instead.', true);
    }
  }
  $('paste').onclick = doPaste;
  $('paste2').onclick = doPaste;

  // Copy button: copies the highlighted text, or everything if nothing is highlighted.
  async function doCopy() {
    const start = codeBox.selectionStart, end = codeBox.selectionEnd;   // the highlight survives clicking a button
    const hasSelection = end > start;
    const text = hasSelection ? codeBox.value.slice(start, end) : codeBox.value;
    if (!text) return msg('Nothing to copy yet.', true);
    const done = hasSelection ? 'Copied selection' : 'Copied';
    try {
      await navigator.clipboard.writeText(text);
      msg(done);
    } catch (e) {                                  // clipboard blocked: try the older way
      codeBox.focus();
      if (hasSelection) codeBox.setSelectionRange(start, end); else codeBox.select();
      if (document.execCommand('copy')) msg(done);
      else msg("Couldn't copy. Press Ctrl+C in the box instead.", true);
    }
  }
  $('copy').onclick = doCopy;

  // Read a text/HTML file into the box (shared by drag & drop and the upload button).
  async function loadFile(f) {
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) return msg('That file is too big (5 MB max).', true);
    const text = await f.text();
    if (text.indexOf('\u0000') !== -1 || text.indexOf('\uFFFD') !== -1)
      return msg("That doesn't look like a text file.", true);
    putText(text, f.name);
  }

  // drag & drop a text/HTML file to fill the box
  const dropOk = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => {
    if (!dropOk(e)) return;
    e.preventDefault(); document.body.classList.add('dragging');
  }));
  window.addEventListener('dragleave', e => {
    if (!e.relatedTarget) document.body.classList.remove('dragging');
  });
  window.addEventListener('drop', async e => {
    if (!dropOk(e)) return;
    e.preventDefault(); document.body.classList.remove('dragging');
    loadFile(e.dataTransfer.files[0]);
  });

  // Upload button: pick a file from the device
  $('upload').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };

  // ---- Undo / redo: our own list of steps, so it also covers Paste, Upload, Clear, Sample ----
  const codeBox = $('code');

  // ---- Word wrap: on by default, and the choice is remembered ----
  let wrapOn = true;
  try { wrapOn = localStorage.getItem('wrap') !== 'off'; } catch (e) {}
  function applyWrap() {
    codeBox.wrap = wrapOn ? 'soft' : 'off';
    $('wrap').setAttribute('aria-pressed', wrapOn);
    $('wrap').title = wrapOn ? 'Turn word wrap off' : 'Turn word wrap on';
    updateWrapGlow();
  }

  // Is any line too long for the box (so wrapping is really happening)?
  // The box uses a fixed-width font, so: longest line x width of one character.
  const ruler = document.createElement('canvas').getContext('2d');
  function isWrapping() {
    if (!wrapOn) return false;
    const css = getComputedStyle(codeBox);
    ruler.font = css.fontStyle + ' ' + css.fontWeight + ' ' + css.fontSize + ' ' + css.fontFamily;
    const boxWidth = codeBox.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
    let longest = 0;
    for (const line of codeBox.value.split('\n')) {
      longest = Math.max(longest, line.replace(/\t/g, '  ').length);
    }
    return longest * ruler.measureText('0').width > boxWidth + 0.5;
  }
  // Brighten the wrap button while wrapping, and flash it when wrapping starts
  let wasWrapping = false;
  function updateWrapGlow() {
    const now = isWrapping();
    $('wrap').classList.toggle('active', now);
    if (!now) $('wrap').classList.remove('flash');
    if (now && !wasWrapping) {
      $('wrap').classList.remove('flash');
      void $('wrap').offsetWidth;          // restart the animation
      $('wrap').classList.add('flash');
    }
    wasWrapping = now;
  }
  $('wrap').addEventListener('animationend', () => $('wrap').classList.remove('flash'));
  addEventListener('resize', updateWrapGlow);
  $('wrap').onclick = () => {
    wrapOn = !wrapOn;
    try { localStorage.setItem('wrap', wrapOn ? 'on' : 'off'); } catch (e) {}
    applyWrap();
  };
  applyWrap();

  let steps = [''], pos = 0, typingTimer;
  function updateUndoRedo() {
    $('undo').disabled = !(pos > 0 || codeBox.value !== steps[pos]);
    $('redo').disabled = pos >= steps.length - 1;
    updateWrapGlow();                       // the text changed, so check if it wraps
  }
  function record() {                       // remember the box's current text (if it changed)
    clearTimeout(typingTimer);
    if (codeBox.value !== steps[pos]) {
      steps = steps.slice(0, pos + 1);  // typing after an undo drops the redo steps
      steps.push(codeBox.value);
      if (steps.length > 200) steps.shift();
      pos = steps.length - 1;
    }
    updateUndoRedo();
  }
  function setBox(text) { record(); codeBox.value = text; record(); }
  function undo() { record(); if (pos > 0) { pos--; codeBox.value = steps[pos]; } updateUndoRedo(); msg(''); }
  function redo() { record(); if (pos < steps.length - 1) { pos++; codeBox.value = steps[pos]; } updateUndoRedo(); msg(''); }
  $('undo').onclick = undo;
  $('redo').onclick = redo;
  codeBox.addEventListener('input', () => { clearTimeout(typingTimer); typingTimer = setTimeout(record, 500); updateUndoRedo(); });
  codeBox.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
  });

  // ---- Save as: write the box to an .html file ----
  $('save').onclick = async () => {
    const text = codeBox.value;
    if (!text.trim()) return msg('Nothing to save yet.', true);
    const title = (text.match(/<title>\s*([^<]*?)\s*<\/title>/i) || [])[1] || '';
    const fileName = (title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'my-game') + '.html';
    msg('');
    try {
      if (window.showSaveFilePicker) {      // a real "Save as" window (Chrome, Chromebooks)
        const handle = await showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'HTML file', accept: { 'text/html': ['.html'] } }] });
        const out = await handle.createWritable();
        await out.write(text);
        await out.close();
        msg('Saved ' + handle.name);
      } else {                              // other browsers: a normal download
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'text/html;charset=utf-8' }));
        a.download = fileName;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        msg('Saved ' + fileName);
      }
    } catch (e) {
      if (e.name !== 'AbortError') msg("Couldn't save the file.", true);   // cancelling is fine
    }
  };

  // allow Tab key in textarea
  codeBox.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
    t.dispatchEvent(new Event('input'));
  });

})();
</script>
</body>
</html>
